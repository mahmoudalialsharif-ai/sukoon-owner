    window._wizPrev = function(){
      saveWizData();
      step--;
      render();
    };
    window._wizNext = function(){
      saveWizData();
      step++;
      render();
    };
    window._wizFinish = function(){
      saveWizData();
      if (!S.meta) S.meta = {};
      S.meta.setupCompleted = true;
      save();
      var b = document.getElementById('setupWizard');
      if (b) b.remove();
      toast('تم إكمال معالج الإعداد بنجاح! 🚀', 'ok');
      route('dashboard');

    function saveWizData(){
      if (!S.settings) S.settings = {};
      if (step === 1){
        var bn = document.getElementById('wizBusinessName');
        if (bn) S.settings.businessName = bn.value;
        var ph = document.getElementById('wizPhone');
        if (ph) S.settings.businessPhone = ph.value;
        var ad = document.getElementById('wizAddress');
        if (ad) S.settings.businessAddress = ad.value;
      } else if (step === 2){
        var br = document.getElementById('wizBranches');
        if (br) S.settings.branches = br.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
        var ft = document.getElementById('wizFti');
        if (ft) S.settings.ftiRate = parseFloat(ft.value)/100 || 0.15;
        var vi = document.getElementById('wizVisa');
        if (vi) S.settings.visaFeeRate = parseFloat(vi.value)/100 || 0.02;
      } else if (step === 3){
        var tk = document.getElementById('wizTgToken');
        var en = document.getElementById('wizEnableTg');
        if (!S.settings.telegram) S.settings.telegram = {};
        if (tk) S.settings.telegram.token = tk.value.trim();
        if (en) {
          S.settings.telegram.pollingEnabled = en.checked;
          if (en.checked && S.settings.telegram.token && typeof startTgPolling === 'function') {
            startTgPolling();
          }
        }
      }
      save();
    }

    render();
  },

  async login(){
    const userInput = el('loginUser') ? el('loginUser').value.trim() : '';
    const passInput = el('loginPass') ? el('loginPass').value : '';
    const ownerSecretCodeEl = document.getElementById('ownerSecretCode');
    const ownerCode = ownerSecretCodeEl ? ownerSecretCodeEl.value.trim() : '';
    const codeToUse = ownerCode || userInput || (document.getElementById('ownerSecretCode') ? document.getElementById('ownerSecretCode').value : '');

    const localUser = S.users ? S.users.find(x => x.username === userInput && x.active) : null;

    if (ownerCode || userInput === 'OWNER' || (!localUser && userInput)) {
        try {
            var r = await fetch(API_BASE + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: codeToUse, password: passInput })
            });
            
            if (r.ok) {
                var data = await r.json();
                if (data && data.token) {
                    sessionStorage.setItem("warm_owner_token", data.token);
                    S.meta.license = { licenseKey: "OWNER", status: "ACTIVE", tier: "OWNER_MASTER", period: "OWNER_MASTER", expiresAt: null, client: "Owner Master", activatedAt: now(), graceDays: 0 };
                    S.session = { id: 'u_owner_hidden', username: 'OWNER', name: 'صاحب النظام', role: 'OWNER', permissions: { admin: true } };
                    saveImmediate();
                    audit('LOGIN_OWNER', 'Owner logged in securely');
                    toast('مرحباً بك يا كابتن', 'good');
                    route('dashboard');
                    return;
                } else {
                    return alert('استجابة ناجحة ولكن لم يتم استلام التوكن من السيرفر');
                }
            } else {
                var errDetail = '';
                try {
                    var errData = await r.json();
                    errDetail = errData.error || errData.message || '';
                } catch(e) {}

                if (r.status === 401) {
                    return alert('كود المالك أو الباسورد غير صحيح');
                } else if (r.status === 404) {
                    return alert('مسار السيرفر غير موجود (تأكد من الرابط)');
                } else {
                    return alert('خطأ في السيرفر (' + r.status + ')' + (errDetail ? ': ' + errDetail : ''));
                }
            }
        } catch(e) {
            console.error('Login fetch error:', e);
            var errMsg = (e && e.message) ? e.message : String(e);
            if (errMsg.indexOf('Failed to fetch') !== -1 || errMsg.indexOf('NetworkError') !== -1 || errMsg.indexOf('TypeError') !== -1) {
                return alert('تعذر الوصول للسيرفر (مشكلة شبكة أو CORS)');
            }
            return alert('خطأ في الاتصال بالسيرفر: ' + errMsg);
        }
    }
    if (Date.now() < loginAttempts.lockedUntil){
      const sec = Math.ceil((loginAttempts.lockedUntil - Date.now())/1000);
      return alert('محاولات كثيرة فاشلة. انتظر ' + sec + ' ثانية');
    }
    const u = localUser || S.users.find(x => x.username === userInput && x.active);
    if (!u) {
      loginAttempts.count++;
      if (loginAttempts.count >= 5){
        loginAttempts.lockedUntil = Date.now() + 5*60*1000;
        loginAttempts.count = 0;
        return alert('تم قفل الدخول 5 دقائق');
      }
      return alert('بيانات الدخول غير صحيحة');
    }
    var ok = false;
    if (u.passwordHash && u.salt){
      var h = await hashPassword(passInput, u.salt);
      ok = (h === u.passwordHash);
    } else if (u.password !== undefined) {
      ok = (u.password === passInput);
      if (ok){
        u.salt = Math.random().toString(36).slice(2, 12);
        u.passwordHash = await hashPassword(passInput, u.salt);
        delete u.password;
        saveImmediate();
      }
    } else {
      var defaults = { admin: '123456', cashier: '123456', supervisor: '123456' };
      var def = defaults[u.username] || '123456';
      if (passInput === def){
        ok = true;
        u.salt = Math.random().toString(36).slice(2, 12);
        u.passwordHash = await hashPassword(passInput, u.salt);
        saveImmediate();
      }
    }
    if (!ok){
      loginAttempts.count++;
      if (loginAttempts.count >= 5){
        loginAttempts.lockedUntil = Date.now() + 5*60*1000;
        loginAttempts.count = 0;
        return alert('تم قفل الدخول 5 دقائق');
      }
      return alert('بيانات الدخول غير صحيحة');
    }
    loginAttempts = { count: 0, lockedUntil: 0 };
    S.session = { id:u.id, username:u.username, name:u.name, role:u.role, permissions: Object.assign({}, u.permissions || {}) };
    S.sessions.push({ id:uid('sess'), username:u.username, role:u.role, loginAt:now(), logoutAt:null });
    if (!S.userSessions) S.userSessions = [];
    S.userSessions.unshift({
      id: uid('us'),
      userId: u.id,
      username: u.username,
      name: u.name,
      role: u.role,
      device: navigator.userAgent.indexOf('Mobile') !== -1 ? 'Mobile' : 'Desktop',
      platform: navigator.platform || 'unknown',
      loginAt: now(),
      logoutAt: null,
      ip: 'local'
    });
    if (S.userSessions.length > 500) S.userSessions.length = 500;
    
    audit('LOGIN', u.username);
    registerDeviceSession(u);
    scheduleHeartbeat();
    startAppTimers();
    setTimeout(checkForUpdate, 10000);
    // Onboarding popup removed permanently

    save();
    if (expired()) { setTimeout(function(){ App.showLicenseModal(); }, 500); }
    if (String(u.role).toUpperCase() === 'CASHIER') {
      route('sales');
    } else {
      route('dashboard');
    }
    if (S.meta && S.meta.setupCompleted === false && isAdmin()){
      setTimeout(function(){ App.showSetupWizard(); }, 300);
    } else if (expired() && isAdmin()){
      setTimeout(function(){ App.showLicenseModal(); }, 400);
    }
  },

  ripple(e){
    var btn = e.currentTarget || (e.target && e.target.closest ? e.target.closest('button, .btn, .quick-sale-btn') : null);
    if (!btn) return;
    var r = btn.getBoundingClientRect();
    var circle = document.createElement('span');
    var d = Math.max(r.width, r.height);
    circle.style.width = circle.style.height = d + 'px';
    var x = e.clientX || (r.left + r.width / 2);
    var y = e.clientY || (r.top + r.height / 2);
    circle.style.left = (x - r.left - d/2) + 'px';
    circle.style.top = (y - r.top - d/2) + 'px';
    circle.className = 'ripple';
    btn.appendChild(circle);
    setTimeout(function(){ circle.remove(); }, 650);
  },
  logout(){
    // 3. Clear all timers (setInterval) before logout
    try {
      clearAllTimers();
    } catch(e) {
      console.warn('Error clearing timers during logout:', e);
    }

    // 1. Wrap each step in try/catch
    try {
      const last = S && S.sessions && S.sessions[S.sessions.length - 1];
      if (last && !last.logoutAt) last.logoutAt = now();
    } catch(e) {
      console.warn('Error closing session in S.sessions:', e);
    }

    try {
      if (S && S.userSessions && S.userSessions.length){
        var lastUs = S.userSessions.find(function(x){ return x.username === (S.session ? S.session.username : '') && !x.logoutAt; });
        if (lastUs) lastUs.logoutAt = now();
      }
    } catch(e) {
      console.warn('Error closing userSession:', e);
    }

    try {
      audit('LOGOUT', S && S.session ? S.session.username : 'user');
    } catch(e) {
      console.warn('Error logging audit during logout:', e);
    }

    try {
      if (S) {
        S.session = null;
      }
    } catch(e) {
      console.warn('Error clearing session:', e);
    }

    try {
      if (typeof saveImmediate === 'function') {
        saveImmediate();
      } else if (typeof save === 'function') {
        save();
      }
    } catch(e) {
      console.warn('Error saving during logout:', e);
    }

    // 2. Render login in fixed #app mount point & 4. location.reload() fallback
    try {
      login();
    } catch(e) {
      console.error('Error invoking login() during logout, falling back to location.reload():', e);
      try {
        location.reload();
      } catch(err) {
        window.location.href = window.location.href;
      }
    }
  },

  addManualJournal(){
    if (!can('accounting')) return permissionDenied();
    try {
      var multiRows = document.querySelectorAll('.mj-line-row');
      if (multiRows && multiRows.length > 0) {
        window.syncManualEntryLinesFromDOM();
        var lines = [];
        var totalD = 0, totalC = 0;
        (window._manualEntryLines || []).forEach(function(l){
          var deb = n(l.debit || 0);
          var crd = n(l.credit || 0);
          if (deb > 0 || crd > 0) {
            lines.push({ account: l.account, debit: deb, credit: crd });
            totalD += deb;
            totalC += crd;
          }
        });
        if (lines.length < 2) throw Error('يجب إدخال سطرين على الأقل للقيد المحاسبي');
        if (totalD <= 0 || totalC <= 0) throw Error('يجب إدخال مبالغ مدينة ودائنة صحيحة');
        if (Math.abs(totalD - totalC) > 0.02) throw Error('القيد غير متوازن: إجمالي المدين (' + money(totalD) + ') لا يساوي إجمالي الدائن (' + money(totalC) + ')');
        var desc = (document.getElementById('mjDesc') ? document.getElementById('mjDesc').value : '').trim() || 'قيد يدوي متعدد';
        post(desc, lines, 'MANUAL');
        audit('MANUAL_JE', desc + ' (' + lines.length + ' أسطر)');
        save();
        toast('تم ترحيل القيد المحاسبي بنجاح', 'good');
        window._manualEntryLines = null;
        route('accounting');
        return;
      }
      const dAmt = n(el('mjDebitAmt').value), cAmt = n(el('mjCreditAmt').value);
      if (dAmt<=0||cAmt<=0) throw Error('المبالغ غير صحيحة');
      if (Math.abs(dAmt-cAmt)>0.02) throw Error('غير متوازن');
      post(el('mjDesc').value||'Manual', [
        {account:el('mjDebitAcc').value, debit:dAmt, credit:0},
        {account:el('mjCreditAcc').value, debit:0, credit:cAmt}
      ], 'MANUAL');
      audit('MANUAL_JE', el('mjDesc').value);
      save();
      toast('تم ترحيل القيد');
      route('accounting');
    } catch(e){ alert(e.message); }

                term.innerHTML = '<div style="color:#94a3b8;">لا توجد سجلات تشخيص حالياً.</div>';
                return;
            }
            term.innerHTML = logs.map(function(item) {

                var level = (item && item.level) ? String(item.level).toLowerCase() : '';
                var time = (item && item.timestamp) ? ('[' + new Date(item.timestamp).toLocaleTimeString() + '] ') : '';
                var color = '#10b981';
                var lower = (text + ' ' + level).toLowerCase();
                if (lower.includes('error') || lower.includes('fail') || lower.includes('fatal') || level === 'error') {
                    color = '#ef4444';
                } else if (lower.includes('warn') || lower.includes('warning') || level === 'warn') {
                    color = '#f59e0b';
                } else if (lower.includes('info')) {
                    color = '#38bdf8';
                }
                return '<div style="color:' + color + '; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-family:monospace; word-break:break-all;">' + time + esc(text) + '</div>';
            }).join('');
            term.scrollTop = term.scrollHeight;
        } catch(err) {

  approveInbox(id){
    if (!isAdmin()) return permissionDenied();
    var item = (S.inbox||[]).find(function(x){ return x.id === id; });
    if (!item) return alert('العنصر غير موجود');
    if (item.status !== 'PENDING') return alert('تمت معالجة هذا الأمر مسبقاً');

    var txt = item.text.trim();
    try {
      var lower = txt.toLowerCase();
      if (lower.startsWith('صرف') || lower.startsWith('مصروف')){
        var parts = txt.split(' ');
        var amt = 0;
        var cat = 'أخرى';
        var method = 'Cash';
        parts.forEach(function(p){
          var num = parseFloat(p);
          if (!isNaN(num) && amt === 0) amt = num;
          else if (p === 'كاش' || p === 'Cash') method = 'Cash';
          else if (p === 'فيزا' || p === 'Visa') method = 'Visa';
          else if (p !== 'صرف' && p !== 'مصروف') cat = p;
        });
        if (!amt) amt = 100;
        recordExpense({
          category: cat,
          description: 'Telegram/Manual: ' + txt,
          amount: amt,
          currency: 'EGP',
          method: method,
          branch: S.settings.defaultBranch || 'الفرع الرئيسي'
        });
      } else if (lower.startsWith('إيراد') || lower.startsWith('بيع')){
        var parts = txt.split(' ');
        var amt = 0;
        var method = 'Cash';
        parts.forEach(function(p){
          var num = parseFloat(p);
          if (!isNaN(num) && amt === 0) amt = num;
          else if (p === 'فيزا' || p === 'Visa') method = 'Visa';
          else if (p === 'كاش' || p === 'Cash') method = 'Cash';
        });
        if (!amt) amt = 200;
        var svc = S.services[0] ? S.services[0].id : '';
        recordSale({
          client: 'Telegram Client',
          customerId: '',
          serviceId: svc,
          amount: amt,
          currency: 'EGP',
          method: method,
          therapistId: '',
          branch: S.settings.defaultBranch || 'الفرع الرئيسي'
        });
      } else if (lower.startsWith('سلفة')){
        var parts = txt.split(' ');
        var amt = 0;
        var empName = '';
        parts.forEach(function(p){
          var num = parseFloat(p);
          if (!isNaN(num) && amt === 0) amt = num;
          else if (p !== 'سلفة') empName = p;
        });
        if (!amt) amt = 500;
        var emp = (S.employees||[]).find(function(e){ return e.name.indexOf(empName) !== -1; });
        if (!emp && S.employees && S.employees.length) emp = S.employees[0];
        if (emp){
          if (!S.advances) S.advances = [];
          S.advances.push({
            id: uid('adv'),
            employeeId: emp.id,
            amount: amt,
            reason: 'Telegram: ' + txt,
            at: now()
          });
          post('Advance ' + emp.name, [
            {account: '1300', debit: amt, credit: 0},
            {account: '1110', debit: 0, credit: amt}
          ], 'ADVANCE');
        }
      } else {
        recordExpense({
          category: 'عام',
          description: txt,
          amount: 100,
          currency: 'EGP',
          method: 'Cash',
          branch: S.settings.defaultBranch || 'الفرع الرئيسي'
        });
      }

      item.status = 'APPROVED';
      audit('INBOX_APPROVE', txt);
      save();
      toast('تم تنفيذ الأمر بنجاح وتسجيله في النظام');
      route('inbox');
    } catch(e){
      alert('خطأ في التنفيذ: ' + e.message);
    }
  },

  syncTelegram: async function(){
    var token = (S.settings.telegram && S.settings.telegram.token) || '';
    if (!token) { toast('أدخل Bot Token من الإعدادات أولاً', 'bad'); return; }
    if (!isAdmin()) return permissionDenied('للمالك فقط');
    toast('جارٍ استلام الرسائل...', 'warn');
    try {
      var offset = (S.settings.telegram && S.settings.telegram.lastOffset) || 0;
      var res = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?offset=' + offset + '&timeout=5', { method: 'GET' });
      var data = await res.json();
      if (!data || !data.ok) throw new Error('فشل جلب التحديثات');
      if (!S.inbox) S.inbox = [];
      var updates = data.result || [];
      var added = 0;
      var maxUpdateId = offset;
      updates.forEach(function(u){
        if (u.update_id >= maxUpdateId) maxUpdateId = u.update_id + 1;
        var msg = u.message || u.edited_message;
        if (!msg || !msg.text) return;
        var fromName = (msg.from ? (msg.from.first_name + (msg.from.username ? ' (@' + msg.from.username + ')' : '')) : 'Telegram User');
        var text = msg.text || '';
        var msgId = String(msg.message_id);
        var already = S.inbox.some(function(x){ return x.tgId === msgId; });
        if (already) return;
        var parsed = parseInboxCommand(text);
        S.inbox.push({
          id: uid('ib'),
          tgId: msgId,
          at: msg.date ? (msg.date * 1000) : now(),
          raw: text,
          source: 'telegram',
          user: fromName,
          parsed: parsed,
          status: 'PENDING'
        });
        added++;
      });
      S.settings.telegram.lastOffset = maxUpdateId;
      S.settings.telegram.lastSync = now();
      audit('TELEGRAM_POLL', added + ' new messages');
      saveImmediate();
      if (added > 0) toast('✅ ' + added + ' رسالة جديدة من تلجرام', 'good');
      else toast('لا توجد رسائل جديدة', 'warn');
      route('inbox');
    } catch(e){
      toast('خطأ المزامنة: ' + e.message, 'bad');
    }
  },

  saveVoucher(){
    var type = document.getElementById('vchType').value;
    var amount = parseFloat(document.getElementById('vchAmount').value);
    var method = document.getElementById('vchMethod').value;
    var date = document.getElementById('vchDate').value;
    var desc = document.getElementById('vchDesc').value.trim();

    if (isNaN(amount) || amount <= 0) return alert('يرجى إدخال مبلغ صحيح');
    if (!desc) return alert('يرجى إدخال بيان للسند');

    var cashAcc = method === 'Visa' ? '1200' : '1100';
    var lines = [];

    if (type === 'in') {
      lines = [
        { account: cashAcc, debit: amount, credit: 0 },
        { account: '4900', debit: 0, credit: amount }
      ];
    } else {
      lines = [
        { account: '5900', debit: amount, credit: 0 },
        { account: cashAcc, debit: 0, credit: amount }
      ];
    }

    try {
      atomicPost('سند ' + (type === 'in' ? 'قبض' : 'صرف') + ': ' + desc, lines, 'VOUCHER');
      if (!S.vouchers) S.vouchers = [];
      S.vouchers.push({
        id: uid('vch'),
        type: type,
        amount: amount,
        method: method,
        date: date,
        desc: desc,
        user: S.session ? S.session.username : 'system',
        at: now()
      });
      audit('VOUCHER_ADD', type + ' / ' + money(amount));
      save();
      toast('تم حفظ السند وترحيله محاسبياً', 'good');
      route('vouchers');
    } catch(e) {
      alert('خطأ في القيد: ' + e.message);
    }
  },

  saveEditedUser(id){
    if (!can('settings')) return permissionDenied();
    var u = S.users.find(x => x.id === id);
    if (!u) return;
    u.username = el('euUser').value.trim() || u.username;
    u.name = el('euName').value.trim() || u.name;
    var p = el('euPass').value.trim();
    if (p) u.password = p;
    u.role = el('euRole').value;
    u.limits = {
      maxSale: n(el('euMaxSale').value),
      maxExpense: n(el('euMaxExp').value)
    };

    var allKeys = [
      'sales','expenses','closing','customers',
      'canDiscount','canDelete','canEdit','canApprove',
      'accounting','treasury','petty','owners','reports',
      'payroll','employees','therapists','attendance','bonuses',
      'licenses','settings','audit'
    ];
    var perms = {};
    allKeys.forEach(k => {
      var box = document.getElementById('eu_' + k);
      if (box) perms[k] = box.checked;
    });
    u.permissions = perms;

    if (S.session && (S.session.id === id || S.session.username === u.username)) {
      S.session.permissions = Object.assign({}, u.permissions);
      S.session.role = u.role;
      S.session.name = u.name;
    }

    audit('USER_EDIT', u.username + ' (' + u.role + ')');
    if (typeof saveImmediate === 'function') saveImmediate();
    save();
    toast('تم تحديث صلاحيات المستخدم بنجاح', 'good');
    document.querySelectorAll('.modal').forEach(m => m.remove());
    route('settings');

  approveExpense(id){
    if (!canAction('canApprove')) return permissionDenied('لا تملك صلاحية اعتماد المصروفات');
    var e = S.expenses.find(function(x){ return x.id === id; });
    if (!e) return;
    e.status = 'POSTED';
    var map = {Oils:'5200',Maintenance:'5300',Utilities:'5400',Marketing:'5500',Other:'5900'};
    var baseAmt = e.baseEGP || baseValue(e.amount, e.currency);
    post('Expense '+e.id, [
      {account: map[e.category]||'5900', debit:baseAmt, credit:0},
      {account: cashAcct(e.method, e.currency||'EGP'), debit:0, credit:baseAmt}
    ], 'EXPENSE');
    audit('EXPENSE_APPROVE', e.id + ' / ' + money(e.amount));
    toast('تم اعتماد المصروف وترحيله بنجاح', 'good');
    save();
    route('expenses');
  },
  rejectExpense(id){
    if (!canAction('canApprove')) return permissionDenied('لا تملك صلاحية رفض المصروفات');
    var idx = S.expenses.findIndex(function(x){ return x.id === id; });
    if (idx === -1) return;
    var e = S.expenses[idx];
    e.status = 'REJECTED';
    audit('EXPENSE_REJECT', e.id);
    toast('تم رفض المصروف', 'bad');
    save();
    route('expenses');
  },
  checkManagerPin(actionName){
    var pin = prompt('أدخل رقم المدير السري للموافقة على ' + (actionName || 'هذا الإجراء') + ':');
    if (!pin) return false;
    var expected = (S && S.settings && S.settings.managerPin) ? String(S.settings.managerPin) : '1234';
    if (String(pin).trim() === expected.trim()) return true;
    alert('رقم المدير السري غير صحيح!');
    return false;
  },
  deleteSale(id){
    if (!App.checkManagerPin('هذا الإجراء')) return;
    if (!S.sales) return;
    var idx = S.sales.findIndex(function(x){ return x.id === id; });
    if (idx === -1) return;
    if (confirm('هل أنت متأكد من حذف هذه الفاتورة؟')){
      var removed = S.sales.splice(idx, 1)[0];
      audit('SALE_DELETE', (removed.invoiceNo || removed.id) + ' / ' + (removed.client || ''));
      saveImmediate();
      toast('تم حذف الفاتورة بنجاح', 'good');
      route('sales');
    }
  },
  deleteExpense(id){
    if (!App.checkManagerPin('هذا الإجراء')) return;
    if (!S.expenses) return;
    var idx = S.expenses.findIndex(function(x){ return x.id === id; });
    if (idx === -1) return;
    if (confirm('هل أنت متأكد من حذف هذا المصروف؟')){
      var removed = S.expenses.splice(idx, 1)[0];
      audit('EXPENSE_DELETE', (removed.id) + ' / ' + (removed.description || ''));
      saveImmediate();
      toast('تم حذف المصروف بنجاح', 'good');
      route('expenses');
    }
  },
  cashBalance,
  totalLiquidity,
  toggleAI(){
    var d = document.getElementById('aiDrawer');
    if (d) d.classList.toggle('open');
  },
  sendAI(){
    var inp = document.getElementById('aiInput');
    var box = document.getElementById('aiMessages');
    if (!inp || !box || !inp.value.trim()) return;
    var txt = inp.value.trim();
    inp.value = '';
    var userMsg = document.createElement('div');
    userMsg.className = 'ai-msg ai-msg-user';
    userMsg.innerHTML = '<div class="ai-msg-avatar">' + svgIcon('employees') + '</div><div class="ai-msg-body">' + esc(txt) + '</div>';
    box.appendChild(userMsg);
    box.scrollTop = box.scrollHeight;
    var answer = aiAnswer(txt);
    setTimeout(function(){
      var botMsg = document.createElement('div');
      botMsg.className = 'ai-msg ai-msg-bot';
      botMsg.innerHTML = '<div class="ai-msg-avatar">' + svgIcon('ai') + '</div><div class="ai-msg-body">' + answer + '</div>';
      box.appendChild(botMsg);
      box.scrollTop = box.scrollHeight;
    }, 400);
  }
};

function aiAnswer(q){
  q = (q || '').toLowerCase();
  if (q.includes('مصروف') || q.includes('مصاريف') || q.includes('expense')) {
    const totalExp = (S.expenses || []).reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    return 'إجمالي المصروفات المسجلة: <b>' + totalExp.toLocaleString() + ' EGP</b> (عدد المعاملات: ' + (S.expenses || []).length + ')';
  }
  if (q.includes('سيولة') || q.includes('خزنة') || q.includes('فلوس') || q.includes('cash') || q.includes('liquidity')) {
    const liq = typeof totalLiquidity === 'function' ? totalLiquidity() : 0;
    const cash = typeof cashBalance === 'function' ? cashBalance() : 0;
    return 'السيولة الإجمالية: <b>' + liq.toLocaleString() + ' EGP</b><br>رصيد النقدية (الخزنة): <b>' + cash.toLocaleString() + ' EGP</b>';
  }
  if (q.includes('مبيعات') || q.includes('إيرادات') || q.includes('sales') || q.includes('revenue')) {
    const totalRev = (S.sales || []).reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    return 'إجمالي المبيعات: <b>' + totalRev.toLocaleString() + ' EGP</b><br>عدد الفواتير: <b>' + (S.sales || []).length + '</b>';
  }
  if (q.includes('خدمة') || q.includes('أحسن') || q.includes('service')) {
    const svcMap = {};
    (S.sales || []).forEach(s => { svcMap[s.serviceId] = (svcMap[s.serviceId] || 0) + 1; });
    let topId = null, maxCount = 0;
    for (var id in svcMap) {
      if (svcMap[id] > maxCount) { maxCount = svcMap[id]; topId = id; }
    }
    const topSvc = (S.services || []).find(s => s.id === topId);
    return topSvc ? 'أكثر خدمة طلباً هي <b>' + esc(topSvc.name) + '</b> بـ ' + maxCount + ' عمليات بيع.' : 'لا توجد بيانات كافية لتحديد الخدمة الأكثر طلباً بعد.';
  }
  if (q.includes('موظفين') || q.includes('سلف') || q.includes('emp')) {
    return 'عدد الموظفين النشطين: <b>' + (S.employees || []).filter(e => e.active).length + '</b><br>عدد السلف المسجلة: <b>' + (S.advances || []).length + '</b>';
  }
  if (q.includes('مكافأة') || q.includes('مكافآت') || q.includes('bonus')) {
    const totalBonuses = (S.bonuses || []).reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    return 'إجمالي المكافآت المسجلة: <b>' + totalBonuses.toLocaleString() + ' EGP</b> (عدد المكافآت: ' + (S.bonuses || []).length + ')';
  }
  if (q.includes('عهدة') || q.includes('petty')) {
    const totalIn = (S.pettyCash || []).filter(p => p.status !== 'REVERSED' && p.type === 'in').reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    const totalOut = (S.pettyCash || []).filter(p => p.status !== 'REVERSED' && p.type === 'out').reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    const bal = totalIn - totalOut;
    return 'رصيد العهدة النثرية: <b>' + bal.toLocaleString() + ' EGP</b> (الداخل: ' + totalIn.toLocaleString() + ' • المنصرف: ' + totalOut.toLocaleString() + ')';
  }
  if (q.includes('مالك') || q.includes('رأس مال') || q.includes('مسحوبات') || q.includes('owner')) {
    const cap = (S.owners || []).filter(o => o.status !== 'REVERSED' && o.type === 'capital').reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    const drw = (S.owners || []).filter(o => o.status !== 'REVERSED' && o.type === 'drawing').reduce((acc, x) => acc + (n(x.amount) || 0), 0);
    return 'رأس المال المُودَع: <b>' + cap.toLocaleString() + ' EGP</b><br>المسحوبات: <b>' + drw.toLocaleString() + ' EGP</b><br>الصافي: <b>' + (cap - drw).toLocaleString() + ' EGP</b>';
  }
  if (q.includes('تنبيه') || q.includes('alert') || q.includes('warning')) {
    return 'النظام يعمل بشكل مستقر. لا توجد تنبيهات حرجة حالياً.';
  }
  return 'أهلاً بك في مساعد WARM AI. يمكنك سؤالي عن:<br>• <b>كام المصروفات؟</b><br>• <b>السيولة</b> أو الخزنة<br>• <b>المبيعات والإيرادات</b><br>• <b>مين أحسن خدمة</b><br>• <b>الموظفين والسلف</b><br>• <b>التنبيهات</b>';
}

document.addEventListener('click', function(e){
  var btn = e.target && e.target.closest ? e.target.closest('button, .btn, .quick-sale-btn') : null;
  if (!btn) return;
  var r = btn.getBoundingClientRect();
  var circle = document.createElement('span');
  var d = Math.max(r.width, r.height);
  circle.style.width = circle.style.height = d + 'px';
  var x = e.clientX || (r.left + r.width / 2);
  var y = e.clientY || (r.top + r.height / 2);
  circle.style.left = (x - r.left - d/2) + 'px';
  circle.style.top = (y - r.top - d/2) + 'px';
  circle.className = 'ripple';
  btn.appendChild(circle);
  setTimeout(function(){ circle.remove(); }, 650);
});

function svgIcon(name, size, cls) {
  var p = "squares-four";
  if (name === "dashboard") p = "squares-four";
  else if (name === "sales") p = "receipt";
  else if (name === "expenses") p = "arrow-circle-down";
  else if (name === "employees") p = "users";
  else if (name === "accounting") p = "calculator";
  else if (name === "reports") p = "chart-line-up";
  else if (name === "ai") p = "robot";
  else if (name === "settings") p = "gear";
  else if (name === "x") p = "x";
  else if (name === "check") p = "check";
  else if (name === "rocket") p = "rocket";
  else if (name === "flame") p = "fire";
  else if (name === "message") p = "envelope";
  else if (name === "coins") p = "coins";
  else if (name === "receipt") p = "receipt";
  else if (name === "banknote") p = "money";
  else if (name === "hourglass") p = "hourglass";
  else if (name === "zap") p = "lightning";
  else if (name === "trend") p = "trend-up";
  else if (name === "alert") p = "warning";
  else if (name === "sparkles") p = "sparkle";
  else if (name === "lock") p = "lock";
  else if (name === "install") p = "download-simple";
  else if (name === "smartphone") p = "device-mobile";
  else if (name === "sun") p = "sun";
  else if (name === "more") p = "dots-three-vertical";
  else if (name === "logout") p = "sign-out";
  else if (name === "calendar") p = "calendar";
  else if (name === "export") p = "export";

  var i = document.createElement("i");
  i.className = "ph ph-" + p;
  if (cls) { i.className += " " + cls; }
  if (size) { i.style.fontSize = size + "px"; }
  return i.outerHTML;
}
window.promptStatusChange = async function(licenseKey, targetStatus) {
    const actionName = targetStatus === "suspended" ? "الإيقاف المؤقت" : "الأرشفة والحذف";
    const reason = prompt('أدخل سبب ' + actionName + ' (سيظهر للعميل):', 'يرجى التواصل مع الإدارة لتجديد الباقة');
    if (reason === null) return;
    await window.updateLicenseStatus(licenseKey, targetStatus, reason);
};

window.updateLicenseStatus = async function(licenseKey, newStatus, reason) {
    reason = reason || '';
    try {
        const res = await fetch(API_BASE + '/god/update-status', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ license: licenseKey, new_status: newStatus, reason: reason })
        });
        if (res.ok) {
            toast('تم تحديث حالة الترخيص بنجاح', 'good');
            var modal = document.getElementById('godModeModal');
            if (modal) modal.style.display = 'none';
            if (window._currentPage === 'licenses') route('licenses');
        } else {
            toast('فشل تحديث حالة الترخيص', 'bad');
        }
    } catch(e) { toast('خطأ في الاتصال', 'bad'); }
};

window.openLicenseHistory = async function(licenseKey) {
    if (!document.getElementById('warm-history-modal')) { createHistoryModalDOM(); }
    const modal = document.getElementById("warm-history-modal");
    const content = document.getElementById("history-modal-content");
    
    modal.classList.add("show");
    modal.style.display = "flex";
    content.innerHTML = '<p style="text-align:center; color:#9aa0b0; padding: 30px;">⏳ جاري تحميل سجل الحركات...</p>';

    try {
        const res = await fetch(API_BASE + '/god/history?license=' + encodeURIComponent(licenseKey), { headers: getAuthHeaders() });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "تعذر جلب البيانات");

        const license = data.license;
        const history = data.history || [];
        document.getElementById("history-modal-title").textContent = '📜 سجل الترخيص: ' + license.client_name;
        
        const statusMap = { active: "✅ نشط", suspended: "⏸️ موقوف", deleted: "🗑️ محذوف" };
        const getPill = function(s) {
            var bg = s==='active'?'rgba(16,185,129,.2)':s==='suspended'?'rgba(245,158,11,.2)':'rgba(239,68,68,.2)';
            var col = s==='active'?'#10b981':s==='suspended'?'#f59e0b':'#ef4444';
            return '<span style="padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; background:' + bg + '; color:' + col + ';">' + (statusMap[s] || s) + '</span>';
        };

        var html = '<div style="margin-bottom:20px; font-size:14px;"><strong>المفتاح:</strong> <code style="color:#22d3ee;">' + license.license_key + '</code> | <strong>الحالة:</strong> ' + getPill(license.status) + '</div>';
        
        if (history.length === 0) {
            html += '<p style="text-align:center; color:#888; padding:20px;">لا توجد حركات مسجلة.</p>';
        } else {
            html += '<table style="width:100%; border-collapse:collapse; font-size:13px; text-align:right;">';
            html += '<tr style="background:rgba(255,255,255,.05); color:#94a3b8;"><th style="padding:10px;">التاريخ</th><th>التحول</th><th>السبب</th></tr>';
            history.forEach(function(row) {
                html += '<tr style="border-bottom:1px solid rgba(255,255,255,.05);">';
                html += '<td style="padding:10px; color:#cbd5e1;">' + fmtDate(row.created_at) + '</td>';
                html += '<td>' + getPill(row.previous_status) + ' ⬅ ' + getPill(row.new_status) + '</td>';
                html += '<td style="color:#94a3b8;">' + (row.reason || '—') + '</td>';
                html += '</tr>';
            });
            html += '</table>';
        }
        content.innerHTML = html;
    } catch (err) {
        content.innerHTML = '<p style="text-align:center; color:#ef4444; padding: 20px;">❌ خطأ: ' + err.message + '</p>';
    }
};

function createHistoryModalDOM() {
    if (document.getElementById('warm-history-modal')) return;
    var div = document.createElement('div');
    div.id = 'warm-history-modal';
    div.style.cssText = 'position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:16px;';
    div.onclick = function(e) { if (e.target === div) { div.classList.remove('show'); div.style.display = 'none'; } };
    div.innerHTML = '<div style="background:#0d1524; border:1px solid rgba(34,211,238,.3); border-radius:16px; width:100%; max-width:600px; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,0.6);">' +
        '<div style="padding:16px 20px; border-bottom:1px solid rgba(120,180,255,.1); display:flex; justify-content:space-between; align-items:center;">' +
            '<h3 id="history-modal-title" style="margin:0; color:#22d3ee; font-size:16px;">📜 سجل الحركات</h3>' +
            '<button onclick="document.getElementById(\'warm-history-modal\').classList.remove(\'show\'); document.getElementById(\'warm-history-modal\').style.display=\'none\';" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>' +
        '</div>' +
        '<div id="history-modal-content" style="padding:20px; overflow-y:auto; flex:1;"></div>' +
    '</div>';
    document.body.appendChild(div);
}
